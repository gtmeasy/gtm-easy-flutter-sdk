name: gtmeasy_growth
description: First-party Flutter / Dart SDK for GTM Easy growth analytics, attribution, surveys, and paywall-funnel events.
version: 0.1.0
homepage: https://gtmeasy.com
repository: https://github.com/gtmeasy/gtm-easy-flutter-sdk
issue_tracker: https://github.com/gtmeasy/gtm-easy-flutter-sdk/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  one_of: ">=1.5.0 <2.0.0"
  one_of_serializer: ">=1.5.0 <2.0.0"
  built_value: ">=8.4.0 <9.0.0"
  built_collection: ">=5.1.1 <6.0.0"
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  flutter_timezone: ^4.0.0
  uuid: ^4.5.0
  meta: ^1.15.0
  web: ^1.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  built_value_generator: ">=8.4.0 <9.0.0"
  mocktail: ^1.0.0
  test: ^1.25.0
  fake_async: ^1.3.0
