name: gtmeasy_growth
description: First-party Flutter / Dart SDK for GTM Easy growth analytics, attribution, surveys, and paywall-funnel events.
version: 0.1.0
homepage: https://gtmeasy.com
repository: https://github.com/gtmeasy/gtm-easy-flutter-sdk
issue_tracker: https://github.com/gtmeasy/gtm-easy-flutter-sdk/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  one_of: ">=1.5.0 <2.0.0"
  one_of_serializer: ">=1.5.0 <2.0.0"
  built_value: ^8.12.7
  built_collection: ">=5.1.1 <6.0.0"
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  flutter_timezone: ^5.1.0
  uuid: ^4.6.0
  meta: ^1.16.0
  web: ^1.1.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  built_value_generator: ^8.12.7
  mocktail: ^1.0.5
  fake_async: ^1.3.3
